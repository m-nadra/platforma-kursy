name: online-courses

services:
  frontend:
    build: ./frontend
    init: true
    ports:
      - 127.0.0.1:5173:5173
    networks: [frontend-net]
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      FRONTEND_PORT: 5173
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/
          target: /app/
          ignore:
          - node_modules/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json   
  backend:
    build: ./backend
    init: true
    ports:
      - 127.0.0.1:3000:3000
    networks: [frontend-net, backend-net]
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD}
      BACKEND_PORT: 3000
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 5173
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: mydb
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - uploads-vol:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
  mysql:
    image: mysql:oracle@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4
    ports:
      - 127.0.0.1:3306:3306
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks: [backend-net]
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - mysql-vol:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1
      start_period: 30s
  redis:
    image: redis:8.8.3@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
    ports:
      - 127.0.0.1:6379:6379
    networks: [backend-net]
    healthcheck:
      test: redis-cli ping | grep -q PONG
      start_period: 30s

networks:
  frontend-net:
  backend-net:

volumes:
  mysql-vol:
  uploads-vol:
